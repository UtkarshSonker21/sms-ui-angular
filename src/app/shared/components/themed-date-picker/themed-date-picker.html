<div class="themed-date-picker-control" #trigger cdkOverlayOrigin #origin="cdkOverlayOrigin">
  <input #inputElement [id]="inputId || null" class="app-date-field themed-date-picker-input" type="text" readonly
    [value]="displayValue" placeholder="dd-mm-yyyy" [disabled]="isDisabled" [attr.aria-label]="ariaLabel"
    aria-haspopup="dialog" [attr.aria-expanded]="isOpen" (click)="togglePicker()" (keydown)="onInputKeydown($event)">
  <button class="themed-date-picker-icon" type="button" tabindex="-1" [disabled]="isDisabled"
    [attr.aria-label]="ariaLabel" (click)="togglePicker()">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="16" rx="2"></rect><path d="M8 3v4M16 3v4M4 9h16"></path></svg>
  </button>
</div>

<ng-template cdkConnectedOverlay [cdkConnectedOverlayOrigin]="useInputAsOrigin ? inputElement : origin" [cdkConnectedOverlayOpen]="isOpen"
  [cdkConnectedOverlayPositions]="positions" [cdkConnectedOverlayWidth]="panelWidth" [cdkConnectedOverlayPush]="true"
  [cdkConnectedOverlayViewportMargin]="8" [cdkConnectedOverlayFlexibleDimensions]="true"
  [cdkConnectedOverlayScrollStrategy]="scrollStrategy" [cdkConnectedOverlayHasBackdrop]="false"
  (overlayOutsideClick)="closePicker()">
  <section class="app-themed-datepicker" role="dialog" [attr.aria-label]="ariaLabel">
    <mat-calendar [selected]="selectedDate" [startAt]="selectedDate || today" (selectedChange)="selectDate($event)"></mat-calendar>
    <footer class="app-themed-datepicker-actions">
      <button type="button" (click)="clearDate()">Clear</button>
      <button type="button" (click)="selectToday()">Today</button>
    </footer>
  </section>
</ng-template>
