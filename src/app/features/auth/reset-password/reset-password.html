<div class="login-wrapper">

    <div class="login-shell">

        <!-- Hero Section -->

        <div class="login-hero">

            <div class="hero-content">

                <img src="assets/images/kafat-logo.jpg" alt="Logo" class="login-avatar">

                <div class="hero-text">

                    <h2>Kafa’at</h2>

                    <p>
                        Program Platform for Higher Education
                    </p>

                </div>

                <img src="assets/images/profile-img.png" alt="Hero" class="login-hero-img">

            </div>

        </div>

        <!-- Form Section -->

        <div class="login-content">

            <form #resetPasswordForm="ngForm" (ngSubmit)="resetPassword(resetPasswordForm)">

                <!-- New Password -->
                <div class="form-group">

                    <label class="field-label required-label">
                        New Password
                    </label>

                    <div class="password-field input-group">

                        <i class="fas fa-lock"></i>

                        <input [type]="showPassword ? 'text' : 'password'" name="newPassword"
                            [(ngModel)]="resetPasswordRequest.newPassword" #newPassword="ngModel" required minlength="6"
                            placeholder="Enter new password" autocomplete="new-password">

                        <button type="button" class="password-toggle" (click)="togglePassword()">
                            <i class="fas" [ngClass]="showPassword ? 'fa-eye-slash' : 'fa-eye'"></i>
                        </button>

                    </div>

                    <div class="validation-error" *ngIf="newPassword.invalid && (newPassword.touched || submitted)">

                        <span *ngIf="newPassword.errors?.['required']">
                            New password is required.
                        </span>

                        <span *ngIf="newPassword.errors?.['minlength']">
                            Password must be at least 6 characters.
                        </span>

                    </div>

                </div>

                <!-- Reset Password Button -->
                <button type="submit" class="btn btn-p mt-4" [disabled]="resetPasswordForm.invalid || isBusy">

                    <span *ngIf="!isBusy">
                        RESET PASSWORD
                    </span>

                    <span *ngIf="isBusy">
                        RESETTING...
                    </span>

                </button>

                <!-- Back to Login -->
                <div class="row mt-3 g-2">

                    <div class="col-12">

                        <button type="button" class="btn btn-g w-100" (click)="goBackToLogin()">

                            <i class="fas fa-arrow-left me-2"></i>

                            BACK TO LOGIN

                        </button>

                    </div>

                </div>

                <p class="browser-note">
                    Create a new password for your account. For security reasons, choose a strong and unique password.
                </p>

            </form>

        </div>

    </div>

</div>
