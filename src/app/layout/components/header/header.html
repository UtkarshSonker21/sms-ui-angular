<header class="header">
  <!-- Left Section: System Name, Divider, Breadcrumb -->
  <div class="header__left">
    <span class="header__system-name">Kafa'at Committee</span>
    <!-- <span class="header__divider"></span>
    <span class="header__breadcrumb">Oversight Dashboard</span> -->
  </div>

  <!-- Center Section: Search Input -->
  <div class="header__center" *ngIf="showGlobalSearch">
    <div class="header__search-container">
      <i class="fa fa-search header__search-icon"></i>
      <input
        type="text"
        class="header__search-input"
        placeholder="Search..."
        aria-label="Search"
        [(ngModel)]="searchQuery"
        (input)="onSearchInput(searchQuery)"
        (focus)="onSearchFocus()"
        autocomplete="off"
      />
      <button
        type="button"
        *ngIf="searchQuery"
        class="header__search-clear-btn"
        (click)="clearSearch()"
        aria-label="Clear search"
      >
        <i class="fa fa-times"></i>
      </button>
      <!-- <span *ngIf="!searchQuery" class="header__search-badge">Ctrl + K</span> -->

      <!-- Global Search Results Dropdown Overlay -->
      <div class="header__search-dropdown" *ngIf="isSearchOpen">
        <!-- Loading State -->
        <div class="header__search-state" *ngIf="isSearching">
          <i class="fa fa-spinner fa-spin header__search-spinner"></i>
          <span>Searching...</span>
        </div>

        <!-- Results Sections -->
        <ng-container *ngIf="!isSearching">
          <div class="header__search-results" *ngIf="hasResults; else noSearchResults">
            <div class="header__search-section" *ngFor="let section of searchSections">
              <ng-container *ngIf="section.items && section.items.length > 0">
                <div class="header__search-section-header">
                  <span class="header__search-section-name">{{ section.sectionName }}</span>
                  <span class="header__search-section-count">{{ section.items.length }}</span>
                </div>
                <div class="header__search-item-list">
                  <div
                    *ngFor="let item of section.items"
                    class="header__search-item"
                    [class.header__search-item--clickable]="!!item.route"
                    (click)="onItemClick(item)"
                  >
                    <div class="header__search-item-info">
                      <div class="header__search-item-title">{{ item.title }}</div>
                      <div class="header__search-item-subtitle" *ngIf="item.subtitle">
                        {{ item.subtitle }}
                      </div>
                    </div>
                    <i class="fa fa-chevron-right header__search-item-icon" *ngIf="item.route"></i>
                  </div>
                </div>
              </ng-container>
            </div>
          </div>

          <!-- No Results State -->
          <ng-template #noSearchResults>
            <div class="header__search-state header__search-state--empty">
              <i class="fa fa-search header__search-empty-icon"></i>
              <div class="header__search-empty-title">No results found</div>
              <div class="header__search-empty-desc" *ngIf="searchQuery">
                No matching records found for "{{ searchQuery }}"
              </div>
            </div>
          </ng-template>
        </ng-container>
      </div>
    </div>
  </div>

  <!-- Right Section: Language, Notification, User Profile -->
  <div class="header__right">

    <!-- Language Selector Dropdown -->
    <div class="header__dropdown-container">
      <button class="header__dropdown-btn" (click)="toggleLanguageDropdown($event)" aria-label="Select Language">
        <span class="header__language-text">{{ selectedLanguage }}</span>
        <i class="fa fa-chevron-down header__chevron-icon" [class.open]="isLanguageDropdownOpen"></i>
      </button>

      <div class="header__dropdown-menu header__dropdown-menu--lang" *ngIf="isLanguageDropdownOpen">
        <button *ngFor="let language of languages" class="header__dropdown-item"
          [class.active]="selectedLanguage === language.code"
          (click)="selectedLanguage = language.code; changeLanguage(language.code); isLanguageDropdownOpen = false">

          <span class="header__dropdown-item-name">
            {{ language.name }}
          </span>

          <span class="header__dropdown-item-code">
            {{ language.code }}
          </span>

        </button>
      </div>
    </div>

    <!-- Notification Button -->
    <button class="header__icon-btn" (click)="openNotifications()" aria-label="Notifications">
      <i class="fa fa-bell header__bell-icon"></i>
    </button>

    <!-- User Avatar & Dropdown -->
    <div class="header__dropdown-container">
      <button class="header__avatar-btn" (click)="toggleProfileDropdown($event)" aria-label="User Profile Menu">
        <span class="header__avatar-initials">{{ userInitials }}</span>
      </button>

      <div class="header__dropdown-menu header__dropdown-menu--profile" *ngIf="isProfileDropdownOpen">
      
        <!-- Profile Header -->
        <div class="header__profile-info"  (click)="goBackToMyProfile()">
          <div class="header__profile-name">{{ currentUser.fullName || 'User Full Name' }}</div>
          <div class="header__profile-role-row">
            <span class="header__profile-role">{{ currentUser.currentRoleName || 'Role Name' }}</span>
            <span class="header__badge header__badge--current-role">Current Role</span>
          </div>
        </div>

        <div class="header__menu-divider"></div>

        <!-- Switch Role Expandable Section -->
        <!-- <div class="header__role-section">
          
          <button class="header__role-toggle" (click)="toggleRolesSection($event)" aria-label="Expand Switch Role">
            <span class="header__role-toggle-left">
              <i class="fa fa-repeat header__role-icon"></i>
              <span>Switch Role</span>
            </span>
            <i class="fa fa-chevron-down header__role-chevron" [class.open]="isRolesSectionExpanded"></i>
          </button>

          <div class="header__role-list" *ngIf="isRolesSectionExpanded">
            <button *ngFor="let role of availableRoles" class="header__role-item"
              [class.active]="role.roleId === currentUser.currentRoleId" (click)="switchRole(role.roleId)">
              <span class="header__role-item-name">{{ role.roleName }}</span>
              <span *ngIf="role.isDefault"
                class="header__badge header__badge--current">Default</span>
            </button>
          </div>
        </div> -->

        <!-- <div class="header__menu-divider"></div> -->

        <!-- Sign Out -->
        <button class="header__dropdown-item header__dropdown-item--signout" (click)="logout()">
          <i class="fa fa-right-from-bracket header__signout-icon"></i>
          <span>Sign Out</span>
        </button>

      </div>
    </div>

  </div>

</header>
